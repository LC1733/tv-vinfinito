<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>TV V∞ · Noticias + Liminal</title>
<style>
:root {
  --primary: #00ff88;
  --primary-dark: #00cc6d;
  --bg: #0e0e10;
  --bg-light: #1c1c20;
  --bg-lighter: #252529;
  --text: #e0e0e0;
  --error: #ff5555;
  --warning: #ffb86c;
  --success: #50fa7b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, sans-serif;
  line-height: 1.6;
  padding: 16px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.wrap {
  width: 100%;
  max-width: 1100px;
  margin: 20px auto;
  padding: 24px;
  border: 1px solid var(--primary);
  border-radius: 24px;
  background: linear-gradient(145deg, #1c1c20, #0f0f12);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

h1 {
  text-align: center;
  margin: 0 0 20px;
  color: var(--primary);
  text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
  font-size: 1.8rem;
  position: relative;
  padding-bottom: 10px;
}

h1::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  border-radius: 3px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin: 14px 0;
  align-items: center;
}

button, select, input[type="search"] {
  background: var(--bg-light);
  border: 1px solid var(--primary);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 40px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 0.85rem;
  outline: none;
}

input[type="search"] { cursor: text; min-width: 180px; }

button { display: flex; align-items: center; gap: 6px; }

button:hover:not(:disabled) {
  background: var(--primary-dark);
  color: #000;
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0, 255, 136, 0.3);
}

button:disabled { opacity: 0.5; cursor: not-allowed; }

.cats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin: 10px 0;
}

.cat-btn {
  padding: 6px 14px;
  font-size: 0.75rem;
  border-radius: 30px;
  background: var(--bg-lighter);
  border: 1px solid #444;
}

.cat-btn.active {
  background: var(--primary);
  color: #000;
  border-color: var(--primary);
  font-weight: 700;
}

.screen {
  position: relative;
  aspect-ratio: 16/9;
  background: #000;
  border: 3px solid #333;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
  margin-bottom: 16px;
}

video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(14, 14, 16, 0.9);
  color: var(--primary);
  font-weight: 600;
  font-size: 1rem;
  gap: 16px;
  transition: opacity 0.3s ease;
  z-index: 10;
  text-align: center;
  padding: 20px;
}

.overlay.hidden { opacity: 0; pointer-events: none; }

.loading-spinner {
  width: 50px;
  height: 50px;
  border: 5px solid rgba(0, 255, 136, 0.3);
  border-radius: 50%;
  border-top-color: var(--primary);
  animation: spin 1s ease-in-out infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.liminal-question {
  font-size: 0.85rem;
  color: #ffcc88;
  max-width: 80%;
  font-style: italic;
}

.status-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding: 8px 16px;
  background: var(--bg-light);
  border-radius: 60px;
  font-size: 0.75rem;
}

.connection-status { display: flex; align-items: center; gap: 8px; }

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--warning);
}

.status-dot.good { background: var(--success); }
.status-dot.bad { background: var(--error); animation: pulse 1.5s infinite; }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.quality-selector {
  background: var(--bg-lighter);
  border-radius: 60px;
  padding: 4px 12px;
  font-size: 0.7rem;
}

.log {
  font: 12px/1.4 monospace;
  background: var(--bg-light);
  border-radius: 20px;
  padding: 12px;
  max-height: 180px;
  overflow: auto;
  margin-top: 16px;
  scrollbar-width: thin;
}

.log-entry {
  margin-bottom: 6px;
  padding-left: 18px;
  position: relative;
}

.log-entry::before {
  content: "›";
  position: absolute;
  left: 0;
  color: var(--primary);
}

.log-entry.error { color: var(--error); }
.log-entry.warning { color: var(--warning); }
.log-entry.success { color: var(--success); }

.notification {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--bg-light);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 40px;
  border-left: 4px solid var(--primary);
  z-index: 1000;
  opacity: 0;
  transition: 0.3s;
  font-size: 0.8rem;
  white-space: nowrap;
  pointer-events: none;
}

.notification.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

footer {
  margin-top: 18px;
  text-align: center;
  font-size: 0.68rem;
  color: #777;
  line-height: 1.5;
}

@media (max-width: 700px) {
  .wrap { padding: 16px; }
  .controls button, .controls select, .controls input { flex: 1 1 45%; justify-content: center; }
  .status-bar { flex-direction: column; align-items: stretch; }
  .notification { white-space: normal; text-align: center; width: 90%; }
}
</style>

function startLiminalQuestions() {
  if (questionInterval) clearInterval(questionInterval);
  liminalDiv.innerText = randomQuestion();
  questionInterval = setInterval(() => {
    if (!overlay.classList.contains('hidden')) liminalDiv.innerText = randomQuestion();

function showNotification(msg, type='info', duration=3000) {
  const n = $('#notification');
  n.textContent = msg;
  n.style.borderLeftColor = type === 'error' ? 'var(--error)' : (type === 'success' ? 'var(--success)' : 'var(--primary)');
  n.classList.add('show');
  setTimeout(() => n.classList.remove('show'), duration);
}

function log(msg, type='info') {
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logBox.prepend(entry);
  if (logBox.children.length > 60) logBox.removeChild(logBox.lastChild);
}

function updateConnectionStatus(status, msg) {
  statusDot.className = 'status-dot';
  if (status === 'good') {
    statusDot.classList.add('good');
    connectionInfo.textContent = 'Buena conexión';
  } else if (status === 'bad') {
    statusDot.classList.add('bad');
    connectionInfo.textContent = msg || 'Problemas';
  } else {
    connectionInfo.textContent = 'Conectando...';
  }
}

function destroyHls() {
  if (hls) {
    try { hls.destroy(); } catch(e) {}
    hls = null;
  }
  if (latencyInterval) clearInterval(latencyInterval);
  latencySpan.textContent = '⏱️ latencia: --s';
  qualitySelect.disabled = true;
  qualitySelect.innerHTML = '<option value="auto">Auto</option>';
}

const canNative = () =>
  player.canPlayType('application/vnd.apple.mpegurl') !== '';

let hlsLibPromise = null;
function ensureHls() {
  if (window.Hls) return Promise.resolve(true);
  if (hlsLibPromise) return hlsLibPromise;
  hlsLibPromise = new Promise((resolve) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
    script.onload = () => resolve(true);
    script.onerror = () => { hlsLibPromise = null; resolve(false); };
    document.head.appendChild(script);
  });
  return hlsLibPromise;
}

function startLatencyMonitor() {
  if (latencyInterval) clearInterval(latencyInterval);
  latencyInterval = setInterval(() => {
    if (player && player.buffered.length > 0) {
      const bufferedEnd = player.buffered.end(player.buffered.length - 1);
      const bufferHealth = Math.max(0, bufferedEnd - player.currentTime);
      latencySpan.textContent = bufferHealth > 0
        ? `⏱️ buffer: ${Math.min(bufferHealth, 10).toFixed(1)}s`
        : '⏱️ latencia: --s';
    } else {
      latencySpan.textContent = '⏱️ latencia: --s';
    }
  }, 2000);
}

function tryUrl(src, token, timeoutMs = 12000) {
  return new Promise(async (resolve) => {
    let settled = false;
    const finish = (ok) => {
      if (settled) return;
      settled = true;
      cleanup();
      resolve(ok);
    };
    const timeout = setTimeout(() => finish(false), timeoutMs);

    const onPlaying = () => finish(true);
    const onError = () => finish(false);
    const cleanup = () => {
      clearTimeout(timeout);
      player.removeEventListener('playing', onPlaying);
      player.removeEventListener('error', onError);
    };

    if (token !== playToken) return finish(false);

    player.addEventListener('playing', onPlaying);
    player.addEventListener('error', onError);

    try {
      if (canNative()) {
        player.src = src;
        await player.play().catch(()=>{});
      } else {
        const ok = await ensureHls();
        if (!ok || !Hls.isSupported()) return finish(false);
        destroyHls();
        hls = new Hls({ enableWorker: true, lowLatencyMode: false,
                        manifestLoadingTimeOut: 8000,
                        fragLoadingTimeOut: 10000 });
        hls.loadSource(src);
        hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
          if (token !== playToken) return;
          qualitySelect.disabled = false;
          qualitySelect.innerHTML = '<option value="auto">Auto</option>';
          data.levels.forEach((level, idx) => {
            const label = level.height ? `${level.height}p` : `${Math.round(level.bitrate/1000)} kbps`;
            qualitySelect.innerHTML += `<option value="${idx}">${label}</option>`;
          });
          qualitySelect.onchange = () => {
            if (!hls) return;
            hls.currentLevel = qualitySelect.value === 'auto' ? -1 : parseInt(qualitySelect.value);
          };
          player.play().catch(()=>{});
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.MEDIA_ERROR && hls) {
            hls.recoverMediaError();
          } else {
            finish(false);
          }
        });
      }
    } catch(e) {
      finish(false);
    }
  });
}

/* ---------- Lista filtrada (categoría + búsqueda) ---------- */
function filteredIndices() {
  return CHANNELS.map((c, i) => ({c, i}))
    .filter(({c}) => (activeCat === 'Todos' || c.cat === activeCat))
    .filter(({c}) => c.label.toLowerCase().includes(searchTerm))
    .map(({i}) => i);
}

function rebuildSelector() {
  const idxs = filteredIndices();
  selector.innerHTML = '';
  idxs.forEach(i => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = CHANNELS[i].label;
    selector.appendChild(opt);
  });
  if (idxs.includes(current)) selector.value = current;
  else if (idxs.length) selector.value = idxs[0];
}

function rebuildCats() {
  const box = $('#cats');
  box.innerHTML = '';
  CATS.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'cat-btn' + (cat === activeCat ? ' active' : '');
    const count = cat === 'Todos' ? CHANNELS.length : CHANNELS.filter(c => c.cat === cat).length;
    b.textContent = `${cat} (${count})`;
    b.onclick = () => {
      activeCat = cat;
      rebuildCats();
      rebuildSelector();
    };
    box.appendChild(b);
  });
}

/* ---------- Carga del canal actual con fallbacks ---------- */
async function playCurrent() {
  const token = ++playToken;
  const channel = CHANNELS[current];
  if (filteredIndices().includes(current)) selector.value = current;
  info.textContent = `Canal: ${channel.label}`;
  overlay.classList.remove('hidden');
  overlayMsg.textContent = 'Cargando canal...';
  startLiminalQuestions();
  destroyHls();
  player.pause();
  player.removeAttribute('src');
  player.load();
  updateConnectionStatus('unknown');
  log(`Cargando: ${channel.label}`, 'info');

  let success = false;
  for (let i = 0; i < channel.srcs.length; i++) {
    if (token !== playToken) return;
    if (i > 0) {
      overlayMsg.textContent = `Probando fuente alternativa ${i + 1}/${channel.srcs.length}...`;
      log(`Fallback ${i + 1} para ${channel.label}`, 'warning');
      destroyHls();
      player.removeAttribute('src');
      player.load();
    }
    success = await tryUrl(channel.srcs[i], token);
    if (success) break;
  }

  if (token !== playToken) return;

  if (success) {
    consecutiveFails = 0;
    updateConnectionStatus('good');
    log(`Reproduciendo: ${channel.label}`, 'success');
    try { localStorage.setItem('lastChannelLabel', channel.label); } catch(e) {}
    startLatencyMonitor();
    overlay.classList.add('hidden');
    stopLiminalQuestions();
  } else {
    updateConnectionStatus('bad', 'Canal no disponible');
    log(`Sin fuentes disponibles: ${channel.label}`, 'error');
    stopLiminalQuestions();
    consecutiveFails++;
    const visibleCount = filteredIndices().length;
    if (!isTesting && consecutiveFails < visibleCount) {
      showNotification(`${channel.label} no disponible, siguiente...`, 'error');
      next();
    } else if (consecutiveFails >= visibleCount) {
      overlayMsg.textContent = '⚠️ Ningún canal disponible. Revisa tu conexión.';
      log('Todos los canales del filtro fallaron. Deteniendo auto-avance.', 'error');
    }
  }
}

function moveBy(delta) {
  const idxs = filteredIndices();
  if (!idxs.length) return;
  let pos = idxs.indexOf(current);
  if (pos === -1) pos = 0;
  else pos = (pos + delta + idxs.length) % idxs.length;
  current = idxs[pos];
  showNotification(CHANNELS[current].label);
  playCurrent();
}
const next = () => moveBy(1);
const prev = () => moveBy(-1);

$('#prev').addEventListener('click', () => { consecutiveFails = 0; prev(); });
$('#next').addEventListener('click', () => { consecutiveFails = 0; next(); });
selector.addEventListener('change', () => {
  consecutiveFails = 0;
  current = parseInt(selector.value);
  showNotification(`Cambiando a: ${CHANNELS[current].label}`);
  playCurrent();
});
$('#search').addEventListener('input', (e) => {
  searchTerm = e.target.value.toLowerCase().trim();
  rebuildSelector();
});
$('#audio').addEventListener('click', () => {
  player.muted = !player.muted;
  $('#audio').innerHTML = player.muted ? '🔇 Silencio' : '🔊 Audio';
  showNotification(player.muted ? 'Audio silenciado' : 'Audio activado');
});
$('#fs').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});
document.addEventListener('click', () => {
  if (!overlay.classList.contains('hidden')) player.play().catch(()=>{});
});

$('#test').addEventListener('click', async () => {
  isTesting = true;
  consecutiveFails = 0;
  const btn = $('#test');
  btn.disabled = true;
  btn.innerHTML = '⏳ Probando...';
  const idxs = filteredIndices();
  log(`🧪 Probando ${idxs.length} canales del filtro actual`, 'info');
  const results = {};
  for (const i of idxs) {
    current = i;
    await playCurrent();
    const works = player.readyState >= 2 && !player.error && !player.paused;
    results[i] = works;
    log(`${CHANNELS[i].label}: ${works ? 'OK ✅' : 'falla ❌'}`, works ? 'success' : 'error');
  }
  // marcar en selector
  [...selector.options].forEach(opt => {
    const i = parseInt(opt.value);
    if (i in results) opt.textContent = CHANNELS[i].label + (results[i] ? ' ✅' : ' ❌');
  });
  log('🧪 Prueba finalizada', 'info');
  showNotification('Prueba completada', 'success');
  btn.disabled = false;
  btn.innerHTML = '🧪 Probar';
  isTesting = false;
  const firstOk = idxs.find(i => results[i]);
  if (firstOk !== undefined) { current = firstOk; playCurrent(); }
});

document.addEventListener('keydown', (e) => {
  if (['SELECT','INPUT'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowRight') { consecutiveFails = 0; next(); }
  if (e.key === 'ArrowLeft')  { consecutiveFails = 0; prev(); }
  if (e.key === ' ') { e.preventDefault(); player.paused ? player.play() : player.pause(); }
  if (e.key === 'm') { player.muted = !player.muted; showNotification(player.muted ? 'Silencio' : 'Audio activado'); }
  if (e.key === 'f') document.documentElement.requestFullscreen();
});

rebuildCats();
rebuildSelector();

setInterval(() => $('#clock').textContent = new Date().toLocaleTimeString(), 1000);

$('#footer').textContent = `© ${new Date().getFullYear()} Luis Cartes Henríquez · Creación original protegida — Convenio de Berna / OMPI · Prohibida su reproducción, adaptación o uso en entrenamiento de IA sin autorización expresa.`;

playCurrent();
</script>
